name: 云端打包 APK

# ============================================================
#  AIHub（WorkBuddy2API-Android）· 云端打包流水线
#
#  触发方式：
#   ① 手动触发 —— Actions → 云端打包 APK → Run workflow
#      可选「测试版(debug)」或「正式版(release)」，版本号框选填（如 200），
#      版本名自动换算；全空也能直接构建（回退 gradle 里写的默认值）
#   ② 打标签触发 —— git tag v2.0.0 && git push origin v2.0.0
#
#  产出（Artifact，在每次运行结果页面底部下载）：
#   - AIHub-正式版-*.apk / AIHub-测试版-*.apk（含 checksums.txt）
#   - 构建日志-*：完整 gradle 日志 + 测试报告 + R8 混淆映射
#
#  签名密钥（可选）：
#   在 Settings → Secrets 配置 AIHUB_STORE_BASE64 / AIHUB_STORE_PASSWORD /
#   AIHUB_KEY_ALIAS / AIHUB_KEY_PASSWORD。未配置时正式版退回 debug 签名，
#   产物仅可用于本地验证（无法覆盖已安装的正式版）。
# ============================================================

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 打包类型（正式版=签名发布版 / 测试版=调试版 / 全部=一次出两包）
        required: true
        type: choice
        default: "测试版(debug)"
        options:
          - "测试版(debug)"
          - "正式版(release)"
          - "全部(both)"
      version_code:
        description: 版本号，选填，整数(如 200)或版本名(如 2.0.0)均可；留空=用 gradle.properties 里的默认值
        required: false
        type: string
        default: ""
      log_level:
        description: 日志模式（快速=精简更快 / 详细=完整日志排查用）
        required: true
        type: choice
        default: "快速模式"
        options:
          - "快速模式"
          - "详细模式"
  push:
    tags:
      - "v*"

concurrency:
  group: cloud-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 云端打包
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ---------- 计算版本号 ----------
      # 只有一个真相来源：app/build.gradle.kts。
      #
      # 这里【不再】用正则去 gradle 文件里抠默认值。之前那么写，结果因为
      #   versionCode = (findProperty("appVersionCode") as String?)?.toIntOrNull() ?: 33
      # 里 "versionCode = " 后面跟的是括号而不是数字，grep 匹配不到 →
      # 退出码 1 → set -e 直接把整个 step 干掉（云端运行 #1 就是这么挂的）。
      #
      # 现在的做法：
      #   · 用户填了版本号 → 换算成 name/code，通过 -P 传给 gradle
      #   · 用户没填       → 什么都不传，gradle 用它自己的默认值
      #   · 两种情况都在构建完成后从 APK 里读回真实版本号（见「读取产物版本号」步骤）
      # 这样版本号只在 build.gradle.kts 里定义一次，不存在两边不一致的可能。
      - name: 计算版本号
        env:
          MANUAL_CODE: ${{ inputs.version_code }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          VERSION_NAME=""
          VERSION_CODE=""
          if [[ "$TAG_NAME" == v* ]] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # 标签触发：版本名取标签（v2.0.0 → 2.0.0），版本号从版本名反推。
            # 不用 `IFS=. read <<<` —— 在 set -e 下它的退出码会让脚本意外终止。
            VERSION_NAME="${TAG_NAME#v}"
            MAJOR="${VERSION_NAME%%.*}"
            REST="${VERSION_NAME#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            # 标签可能是不带点的形式（v2），此时 REST 等于原文，MINOR/PATCH 会等于整串。
            # 只接受 x.y.z 三段，其它情况直接报错，避免算出荒谬的版本号。
            if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::标签 $TAG_NAME 不是 v主.次.修订 格式（如 v2.0.0）"
              exit 1
            fi
            VERSION_CODE=$((10#$MAJOR * 100 + 10#$MINOR * 10 + 10#$PATCH))
          elif [ -n "$MANUAL_CODE" ]; then
            if [[ "$MANUAL_CODE" =~ ^[0-9]+$ ]]; then
              VERSION_NAME="$((10#$MANUAL_CODE / 100)).$(((10#$MANUAL_CODE % 100) / 10)).$((10#$MANUAL_CODE % 10))"
              VERSION_CODE="$MANUAL_CODE"
            elif [[ "$MANUAL_CODE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              VERSION_NAME="$MANUAL_CODE"
              MAJOR="${VERSION_NAME%%.*}"
              REST="${VERSION_NAME#*.}"
              MINOR="${REST%%.*}"
              PATCH="${REST#*.}"
              VERSION_CODE=$((10#$MAJOR * 100 + 10#$MINOR * 10 + 10#$PATCH))
            else
              echo "::error::版本号需为整数（如 200）或版本名（如 2.0.0），收到：$MANUAL_CODE"
              exit 1
            fi
          else
            echo "ℹ 未指定版本号 → 使用 app/build.gradle.kts 里的默认值（构建后从 APK 读回实际值）"
          fi
          # 未指定时留空，后续步骤会从 APK 读回真实值；命名阶段必须处理空值。
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          if [ -n "$VERSION_CODE" ]; then
            echo "GRADLE_VERSION_ARGS=-PappVersionCode=${VERSION_CODE} -PappVersionName=${VERSION_NAME}" >> "$GITHUB_ENV"
            echo "✔ 将注入版本：$VERSION_NAME ($VERSION_CODE)"
          else
            echo "GRADLE_VERSION_ARGS=" >> "$GITHUB_ENV"
          fi

      # ---------- 确定打包类型 ----------
      - name: 确定打包类型
        run: |
          BT="${{ inputs.build_type }}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            BT="正式版(release)"
          fi
          if [ "$BT" = "正式版(release)" ]; then
            echo "GRADLE_TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "PKG_TYPE=正式版" >> "$GITHUB_ENV"
          elif [ "$BT" = "全部(both)" ]; then
            echo "GRADLE_TASK=assembleDebug assembleRelease" >> "$GITHUB_ENV"
            echo "PKG_TYPE=全部" >> "$GITHUB_ENV"
          else
            echo "GRADLE_TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "PKG_TYPE=测试版" >> "$GITHUB_ENV"
          fi
          echo "✔ 打包类型=$PKG_TYPE  任务=$GRADLE_TASK"

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 本项目 compileOptions / jvmTarget 均为 17（见 app/build.gradle.kts）
          java-version: 17

      # ---------- 安装 SDK 平台 ----------
      # 本项目 compileSdk = android-37.0，它位于 Google 的 preview channel，
      # 不在稳定 channel，必须带 --channel=3 才会被 sdkmanager 找到。
      - name: 安装 SDK Platform 37 与 Build Tools
        run: |
          set -e
          # sdkmanager 的路径在不同 runner 镜像里不一样，逐个探测（与既有 build.yml 一致）
          SDKM=""
          for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            [ -x "$c" ] && SDKM="$c" && break
          done
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          echo "✔ sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          # android-37.0 位于 Google 的 preview channel，必须带 --channel=3；
          # 稳定 channel 只有 android-37（写法不同，两个都试一次）
          "$SDKM" --channel=3 --install "platforms;android-37.0" \
            || "$SDKM" --install "platforms;android-37" \
            || { echo "::error::无法安装 android-37.0"; exit 1; }
          "$SDKM" --install "build-tools;35.0.0" || true
          echo "---- 已安装平台 ----"
          ls "$ANDROID_HOME/platforms"

      - name: 设置 Gradle 缓存（加速后续打包）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary: on-failure

      # ---------- 签名密钥 ----------
      # app/build.gradle.kts 的 releaseSigning() 读的是环境变量：
      #   AIHUB_STORE_FILE / AIHUB_STORE_PASSWORD / AIHUB_KEY_ALIAS / AIHUB_KEY_PASSWORD
      # 这里把 Secret 里的 base64 keystore 落盘并导出这些变量。
      # 未配置时 build.gradle 会自动退回 debug 签名（只警告，不失败）。
      - name: 准备签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.AIHUB_STORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AIHUB_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AIHUB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AIHUB_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aihub-release.jks"
            {
              echo "AIHUB_STORE_FILE=$RUNNER_TEMP/aihub-release.jks"
              echo "AIHUB_STORE_PASSWORD=$STORE_PASSWORD"
              echo "AIHUB_KEY_ALIAS=$KEY_ALIAS"
              echo "AIHUB_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "✔ 已使用 GitHub Secrets 中的签名密钥"
          else
            echo "::warning::未配置 AIHUB_STORE_BASE64，正式版将退回 debug 签名，无法覆盖已安装的正式版"
            echo "⚠ 未配置签名密钥 → 退回 debug 签名（仅限本地验证）"
          fi

      # ---------- 正式打包 ----------
      - name: "🏗️ 执行打包：${{ env.GRADLE_TASK }}"
        shell: bash
        env:
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          mkdir -p build-log
          echo "===== 开始打包：${GRADLE_TASK} | 版本 ${VERSION_NAME}(${VERSION_CODE}) ====="
          set -o pipefail
          if [ "${{ inputs.log_level }}" = "详细模式" ]; then
            GRADLE_LOG_FLAGS="--info --warning-mode all"
          else
            GRADLE_LOG_FLAGS=""
          fi
          echo "📋 日志模式：${GRADLE_LOG_FLAGS:-快速（精简）}"
          # 版本号走 -P 而不是环境变量：Gradle daemon 会固化启动时的环境变量，
          # 之后 System.getenv 读到的是 daemon 的环境，注入会失效（实测过）。
          # GRADLE_VERSION_ARGS 为空时不传任何 -P，gradle 用自己的默认值。
          # 全部(both) 时 GRADLE_TASK 含两个任务，不能加引号
          # shellcheck disable=SC2086
          ./gradlew ${GRADLE_TASK} ${GRADLE_VERSION_ARGS} \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --stacktrace --console=plain --build-cache ${GRADLE_LOG_FLAGS} \
            2>&1 | tee build-log/gradle.log

      # ---------- 从产物里读回真实版本号 ----------
      # 用户没填版本号时，上面的 VERSION_NAME/VERSION_CODE 是空的；
      # 这里从 APK 读回实际值，供后续「校验」「命名」「Artifact 名」使用。
      # 只认一个真相来源：APK 里实际打进去的版本号。
      - name: 🔍 读取产物版本号
        if: success()
        run: |
          set -e
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          FIRST_APK=$(ls app/build/outputs/apk/*/*.apk 2>/dev/null | head -1)
          if [ -z "$FIRST_APK" ]; then
            echo "::error::没有找到任何 APK 产物"
            exit 1
          fi
          INFO=$("$AAPT2" dump badging "$FIRST_APK" 2>/dev/null | head -1)
          GOT_CODE=$(echo "$INFO" | grep -oP "versionCode='\K[0-9]+")
          GOT_NAME=$(echo "$INFO" | grep -oP "versionName='\K[^']+")
          if [ -z "$GOT_CODE" ] || [ -z "$GOT_NAME" ]; then
            echo "::error::无法从 $FIRST_APK 读取版本号"
            exit 1
          fi
          # 用户填了版本号，就必须和填的一致；没填则以 APK 里的为准
          if [ -n "$VERSION_CODE" ] && { [ "$GOT_CODE" != "$VERSION_CODE" ] || [ "$GOT_NAME" != "$VERSION_NAME" ]; }; then
            echo "::error::版本号注入失败：期望 $VERSION_NAME($VERSION_CODE)，实际 $GOT_NAME($GOT_CODE)"
            exit 1
          fi
          echo "VERSION_NAME=$GOT_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GOT_CODE" >> "$GITHUB_ENV"
          echo "✔ 产物版本：$GOT_NAME ($GOT_CODE)"

      # ---------- 校验版本号真的进了包 ----------
      # 只打印日志不算验证：必须从 APK 里读回来核对，否则注入失效会静默通过。
      # ---------- 整理产物 ----------
      - name: 📦 整理 APK 产物
        if: success()
        run: |
          set -e
          case "$GRADLE_TASK" in
            assembleRelease) APK_DIRS="app/build/outputs/apk/release" ;;
            "assembleDebug assembleRelease") APK_DIRS="app/build/outputs/apk/release app/build/outputs/apk/debug" ;;
            *) APK_DIRS="app/build/outputs/apk/debug" ;;
          esac
          mkdir -p dist
          SHA=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d-%H%M)
          COUNT=0
          for APK_DIR in $APK_DIRS; do
            case "$APK_DIR" in
              *release*) TYPE="正式版" ;;
              *) TYPE="测试版" ;;
            esac
            for f in "$APK_DIR"/*.apk; do
              [ -e "$f" ] || continue
              BASE="AIHub-${TYPE}-v${VERSION_NAME}_${VERSION_CODE}-${DATE}-${SHA}"
              cp "$f" "dist/${BASE}.apk"
              echo "✔ 产物：dist/${BASE}.apk ($(du -h "$f" | cut -f1))"
              COUNT=$((COUNT+1))
            done
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::未生成 APK，请查看日志：$APK_DIRS"
            exit 1
          fi
          sha256sum dist/*.apk > dist/checksums.txt
          echo "---- 产物清单 ----"
          ls -lh dist/

      # ---------- 上传 APK ----------
      - name: ⬆️ 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "AIHub-${{ env.PKG_TYPE }}-v${{ env.VERSION_NAME }}"
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # ---------- 收集 daemon 日志 ----------
      - name: 📋 收集 Gradle daemon 日志
        if: always()
        run: |
          mkdir -p build-log/daemon
          cp -f "$HOME"/.gradle/daemon/*/*.out.log build-log/daemon/ 2>/dev/null || true
          ls -la build-log/daemon/ 2>/dev/null || true

      # ---------- 上传完整构建日志 ----------
      - name: ⬆️ 上传完整构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "构建日志-${{ env.PKG_TYPE }}-v${{ env.VERSION_NAME }}"
          path: |
            build-log/
            app/build/reports/
            app/build/outputs/mapping/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 7

      # ---------- 失败时抓精简摘要 ----------
      - name: 🐞 生成精简报错摘要（几 KB，直接给 AI / 排查用）
        if: failure()
        shell: bash
        run: |
          LOG="build-log/gradle.log"
          SUM="build-log/error-summary.txt"
          {
            echo "========== AIHub 构建失败 · 精简摘要（完整日志见同目录 gradle.log） =========="
            echo ""
            echo "===== ① 失败的任务 ====="
            grep -nE "> Task .*FAILED" "$LOG" 2>/dev/null | head -20 || true
            echo ""
            echo "===== ② Kotlin 编译错误 ====="
            grep -nE "^e: " "$LOG" 2>/dev/null | head -60 || true
            echo ""
            echo "===== ③ 根因（What went wrong / Caused by）====="
            grep -nA8 "What went wrong:" "$LOG" 2>/dev/null | head -50 || true
            grep -nE "Caused by" "$LOG" 2>/dev/null | head -15 || true
            echo ""
            echo "===== ④ 依赖/资源解析失败 ====="
            grep -nE "Could not resolve|Failed to resolve|Could not find|Unresolved reference|no matching|incompatible" "$LOG" 2>/dev/null | head -20 || true
            echo ""
            echo "===== ⑤ R8 / 混淆相关 ====="
            grep -niE "R8|Missing class|proguard" "$LOG" 2>/dev/null | head -20 || true
          } | tee "$SUM"
          echo ""
          echo "✅ 精简摘要：$SUM"
          echo "   $(wc -l < "$SUM") 行 · $(du -h "$SUM" | cut -f1) —— 把这个文件给 AI 看即可"
