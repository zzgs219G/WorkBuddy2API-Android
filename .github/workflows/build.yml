# 编译检查（不发布 APK）
#
# 为什么 CI 不产出可安装的 APK：
#   APK 必须用固定的 release keystore 签名，否则与已安装版本签名冲突、
#   无法覆盖安装。密钥材料不进仓库，而 CI 若要从 Secrets 取，
#   等于把签名权搬上云端；本项目是个人自用工具，
#   构建与签名都留在本机更简单也更好审计。
#
# 因此 CI 只负责一件事：确认 main 分支能编译通过，
# 防止把编译错误留到发版时才发现。
#
# 正式构建与发布走本地：/opt/android-sdk/build.sh release

name: Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只读权限：这个 workflow 不写任何东西
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK Platform 37
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=""
          for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            [ -x "$c" ] && SDKM="$c" && break
          done
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;36.0.0" \
            || "$SDKM" --install "platforms;android-37" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      # 只编译，不出包。assemble 会走签名流程，而 release keystore
      # 不在 CI 里，产出的包反而会误导使用者。
      #
      # 日志重定向到文件再打印：编译错误的行很长（含 URL 编码的绝对路径），
      # 直接打在 step 日志里会被 GitHub 截断；同时用 ::error:: 输出一份精简版，
      # 这样错误会出现在 Actions 的 annotation 区 —— 那里不登录也能读到，
      # 比翻 step 日志方便。
      - name: Compile check
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin :app:compileReleaseKotlin --stacktrace --console=plain 2>&1 | tee compile.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            # 把 Kotlin 编译错误发成 annotation（不登录也能在 Actions 页面读到）。
            #
            # 这里只用 python3 做 URL 解码，不自己拼 printf 转义：
            # 之前写过 `printf '%b' "${line//%/\x}"`，它会把行里所有的 % 都
            # 替换成 \x，遇到正常文本里的百分号就变成乱码甚至被解释成控制字符。
            # urllib.parse.unquote 只解有效的 %XX，其余原样保留。
            python3 - <<'EOF'
          import re, urllib.parse
          with open('compile.log', encoding='utf-8', errors='replace') as handle:
              for line in handle:
                  if not line.startswith('e: '):
                      continue
                  # 去掉 file:// 前缀并用 basename 缩短：路径里有中文目录，
                  # URL 编码后极长，annotation 里只看文件名更有用。
                  text = urllib.parse.unquote(line.rstrip())
                  text = re.sub(r'file://\S*/([^/]+):', r'\1:', text)
                  print(f"::error::{text[:300]}")
          EOF
          fi
          exit "$STATUS"

      # 单元测试。
      #
      # 为什么必须在云端跑：本地编译通过不代表逻辑正确 —— 这个项目已经踩过两次
      # 「编译通过、运行无报错、只是什么都不做」的静默失效（PromptRules 的
      # 模板句替换左右两侧写成了一样、FINGERPRINT_MARKERS 门禁漏掉身份句触发词）。
      # 那两次都是靠 PromptSanitizeTest 才抓出来的，而原先 CI 根本不跑测试。
      #
      # testDebugUnitTest 是纯 JVM 测试，不需要模拟器，几十秒能跑完。
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee test.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            # 失败的用例名与断言消息在 XML 里最清楚，直接抽出来发 annotation
            python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET, urllib.parse
          for path in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              root = ET.parse(path).getroot()
              for case in root.iter('testcase'):
                  for fail in list(case.iter('failure')) + list(case.iter('error')):
                      cls = (case.get('classname') or '').split('.')[-1]
                      msg = (fail.get('message') or '').replace('\n', ' ')[:200]
                      print(f"::error::FAILED {cls}.{case.get('name')} -- {msg}")
          EOF
          fi
          exit "$STATUS"

      # 测试报告作为 artifact 上传：失败时可以直接下载 HTML 报告看完整堆栈，
      # 比在日志里翻快得多。
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
